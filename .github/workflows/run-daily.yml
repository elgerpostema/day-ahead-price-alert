name: Run Day-Ahead Price Alert

on:
  schedule:
    # Dit triggert de actie elke dag om 14:00 UTC (15:00 NL wintertijd / 16:00 zomertijd)
    - cron: '0 14 * * *'
  workflow_dispatch: # Dit zorgt ervoor dat je de actie ook handmatig kunt testen via de GitHub website

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen uit repository
      uses: actions/checkout@v4

    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.7' # Kies een stabiele versie, 3.12/3.13 werkt uitstekend op GitHub Actions

    - name: Afhankelijkheden installeren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Script uitvoeren met GitHub Secrets
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      run: python main.py

